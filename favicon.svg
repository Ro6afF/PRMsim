<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#13141f" />
  
  <!-- Central Obstacle (avoided by the path) -->
  <circle cx="34" cy="38" r="13" fill="#222436" />
  
  <!-- Faded PRM Graph Edges (The computed roadmap) -->
  <g stroke="#3b4252" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="52" x2="42" y2="50" />
    <line x1="42" y1="50" x2="52" y2="12" />
    <line x1="20" y1="24" x2="14" y2="10" />
    <line x1="14" y1="10" x2="40" y2="20" />
    <line x1="42" y1="50" x2="58" y2="40" />
    <line x1="58" y1="40" x2="52" y2="12" />
  </g>
  
  <!-- Highlighted Planned Path -->
  <path d="M 12 52 L 20 24 L 40 20 L 52 12" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Unselected Sampled Nodes -->
  <g fill="#616e88">
    <circle cx="42" cy="50" r="3" />
    <circle cx="14" cy="10" r="3" />
    <circle cx="58" cy="40" r="3" />
  </g>
  
  <!-- Nodes along the active path -->
  <g fill="#ffffff">
    <circle cx="20" cy="24" r="4" />
    <circle cx="40" cy="20" r="4" />
  </g>
  
  <!-- Start Node (Green) -->
  <circle cx="12" cy="52" r="5.5" fill="#10b981" />
  <circle cx="12" cy="52" r="2" fill="#13141f" />
  
  <!-- Goal Node (Red) -->
  <circle cx="52" cy="12" r="5.5" fill="#f43f5e" />
  <circle cx="52" cy="12" r="2" fill="#13141f" />
</svg>
