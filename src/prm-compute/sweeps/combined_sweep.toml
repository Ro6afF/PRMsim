# === Sweeps from canopy ===

# --- Baselines ---

[[sweeps]]
name = "[canopy] Baseline K-Nearest"
prm_generations = 1000
paths_per_prm = 1000
robot_config_file = "canopy/robot.json"
obstacle_config_file = "canopy/obstacles.json"
[sweeps.sampling_config]
num_samples = 100
sampling_strategy = "uniform"
sigma = 0.05
[sweeps.connection_config]
strategy = "k-nearest"
k = 3
d = 0.2
avoidCycles = false
[sweeps.planning_config]
heuristic = "none"
num_restarts = 100

